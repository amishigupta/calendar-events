<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Extract Event</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f9fafb;
    color: #111827;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 10px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  #capture-btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }
  #capture-btn:active {
    background: #1d4ed8;
  }
  #preview {
    display: none;
    width: 100%;
    max-height: 140px;
    object-fit: contain;
    border-radius: 8px;
    margin-top: 10px;
    border: 1px solid #e5e7eb;
  }
  #status {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 10px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 12px;
    color: #4b5563;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid #d1d5db;
    border-top-color: #4b5563;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #error {
    display: none;
    margin-top: 10px;
    padding: 8px 10px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    font-size: 12px;
    color: #b91c1c;
  }
  #form {
    display: none;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
    padding: 10px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .field label {
    font-size: 10px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .field input,
  .field textarea {
    font-size: 12px;
    padding: 6px 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-family: inherit;
  }
  .field textarea {
    resize: vertical;
    min-height: 44px;
  }
  #recurrence {
    font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .hint {
    font-size: 10px;
    color: #9ca3af;
  }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .date-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .date-row input {
    flex: 1;
  }
  .date-row button,
  #add-date-btn {
    flex-shrink: 0;
    border: 1px solid #d1d5db;
    background: #fff;
    border-radius: 6px;
    font-size: 12px;
    padding: 4px 8px;
    color: #6b7280;
  }
  #add-date-btn {
    align-self: flex-start;
    color: #2563eb;
    border: none;
    padding: 0;
    background: none;
    font-weight: 600;
  }
  #export-btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    margin-top: 4px;
  }
  #export-btn:active {
    background: #1d4ed8;
  }
</style>
</head>
<body>
  <h1>Extract Event from Screen</h1>
  <button id="capture-btn" type="button">📸 Capture This Tab</button>

  <img id="preview" alt="Captured tab preview" />

  <div id="status">
    <span class="spinner"></span>
    <span>Extracting event details…</span>
  </div>

  <div id="error"></div>

  <div id="form">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" placeholder="Event title" />
    </div>

    <div class="field">
      <label>Dates</label>
      <div id="dates-list"></div>
      <button id="add-date-btn" type="button">+ Add date</button>
    </div>

    <div class="field">
      <label for="recurrence">Recurrence</label>
      <input id="recurrence" type="text" placeholder="e.g. RRULE:FREQ=WEEKLY;BYDAY=FR" />
      <span class="hint">For repeating events. Leave blank for a one-time event.</span>
    </div>

    <div class="two-col">
      <div class="field">
        <label for="startTime">Start time</label>
        <input id="startTime" type="time" />
      </div>
      <div class="field">
        <label for="endTime">End time</label>
        <input id="endTime" type="time" />
      </div>
    </div>

    <div class="field">
      <label for="location">Location</label>
      <input id="location" type="text" placeholder="Location" />
    </div>

    <div class="field">
      <label for="meetingLink">Meeting link</label>
      <input id="meetingLink" type="url" placeholder="Zoom / Google Meet URL" />
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" placeholder="Description"></textarea>
    </div>

    <button id="export-btn" type="button">Export to Google Calendar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
